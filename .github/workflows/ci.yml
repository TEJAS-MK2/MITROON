name: MITROON CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate browser and server JavaScript
        run: |
          node --check game.js
          node --check server/server.js
          node -e "JSON.parse(require('node:fs').readFileSync('server/package.json','utf8'))"
      - name: Install realtime server dependencies
        working-directory: server
        run: npm install --ignore-scripts --no-audit --no-fund
